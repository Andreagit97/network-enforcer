apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: istio-fluent-bit
    {{- include "network-enforcer.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Tag               istio.ztunnel
        Path              /var/log/containers/*ztunnel*.log
        Parser            cri
        DB                /fluent-bit/state/ztunnel.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name         parser
        Match        istio.ztunnel
        Key_Name     log
        Parser       ztunnel_json
        Reserve_Data On
        Preserve_Key Off

    [FILTER]
        Name   lua
        Match  istio.ztunnel
        script /fluent-bit/scripts/ztunnel_to_otel.lua
        call   to_otel

    [OUTPUT]
        Name                     opentelemetry
        Match                    istio.ztunnel
        Host                     {{ include "network-enforcer.fullname" . }}-otlp
        Port                     4317
        grpc                     On
        grpc_logs_uri            /opentelemetry.proto.collector.logs.v1.LogsService/Export
        Logs_Body_Key            body
        Logs_Body_Key_Attributes true
        Tls                      Off
        Tls.verify               On

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name   ztunnel_json
        Format json

  ztunnel_to_otel.lua: |

    local function extract_port(address)
      if address == nil then
        return ""
      end
      local port = tostring(address):match(":(%d+)$")
      if port == nil then
        return ""
      end
      return port
    end

    local function to_monitor_event(timestamp, record)
      local proxy = record["proxy"] or {}
      local inbound = record["inbound"] or {}

      local out = {}
      out["evt.type"] = "monitor"
      -- `namespace/name` format
      -- e.g. "default/http-server-7bbf596dd9-8gs65"
      out["dst.namespaced_name"] = proxy["wl"] or ""
      -- `namespace/name` format if present, otherwise ""
      -- e.g. "default/deny-http-server-monitor"
      out["policy"] = record["policy"]
      -- `ip:port` format
      out["src.ip"] = inbound["peer"] or ""
      out["body"] = "monitor"
      return 1, timestamp, out
    end

    local function to_learn_event(timestamp, record)
      -- We are only interested in inbound connections
      if record["direction"] ~= "inbound" then
        return -1, timestamp, record
      end

      local out = {}
      out["evt.type"] = "learn"
      out["dst.name"] = record["dst.workload"]
      out["dst.namespace"] = record["dst.namespace"]
      out["dst.port"] = extract_port(record["dst.hbone_addr"])
      out["src.identity"] = record["src.identity"]
      -- we need a body field for the OpenTelemetry output plugin to work correctly
      -- todo! check if there is an alternative way
      out["body"] = "learn"
      return 1, timestamp, out
    end

    function to_otel(tag, timestamp, record)
      local message = record["message"]

      -- The log message should start with `dry-run:`
      if string.find(message or "", "^dry%-run:") then
        return to_monitor_event(timestamp, record)
      end

      if record["message"] == "connection complete" then
        return to_learn_event(timestamp, record)
      end
      return -1, timestamp, record
    end
