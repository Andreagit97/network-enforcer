{{- if eq .Values.telemetry.collectorStrategy "default" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network-enforcer.fullname" . }}-otel-collector
  labels:
  {{- include "network-enforcer.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: {{ include "network-enforcer.otelCollector.certDir" . }}/tls.crt
              key_file: {{ include "network-enforcer.otelCollector.certDir" . }}/tls.key
    connectors:
      count:
        logs:
          network_enforcer_policy_denies:
            description: "Total network policy deny events observed by cniwatcher"
            conditions:
              - 'attributes["cni.type"] != nil'
            attributes:
              - key: cni.type
              - key: network.protocol
              - key: node.name
              - key: source.namespace
              - key: source.name
              - key: destination.namespace
              - key: destination.name
              - key: destination.port
                default_value: "0"
              # Slice attrs are stringified as JSON arrays on the Prometheus
              # label (e.g. ["app=http-client"]). default_value keeps the
              # datapoint when the OTLP log omits an optional slice.
              - key: source.labels
                default_value: ""
              - key: destination.labels
                default_value: ""
              - key: source.workloads
                default_value: ""
              - key: destination.workloads
                default_value: ""
              - key: egress.enforced_by
                default_value: ""
              - key: ingress.enforced_by
                default_value: ""
    processors:
      deltatocumulative: {}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      debug:
        verbosity: normal
      prometheus:
        endpoint: 0.0.0.0:9090
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [count, debug]
        metrics:
          receivers: [count, otlp]
          processors: [deltatocumulative]
          exporters: [prometheus]
{{- end }}
