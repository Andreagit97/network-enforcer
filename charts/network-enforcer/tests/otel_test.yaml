suite: "Verify Otel Configurations"
templates:
  - templates/controller/deployment.yaml
  - templates/cniwatcher/daemonset.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
set:
  telemetry:
    externalCollector:
      endpoint: https://otel-endpoint:12345
      protocol: http/protobuf
      otelCollectorCertificateSecret: certSecretName
      otelCollectorClientCertificateSecret: clientCertSecretName

sharedNoneAsserts: &sharedNoneAsserts
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
      any: true
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_PROTOCOL
      any: true
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CERTIFICATE
      any: true

sharedDefaultAsserts: &sharedDefaultAsserts
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://my-release-network-enforcer-otel-collector.my-namespace.svc.cluster.local:4317
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: grpc
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CERTIFICATE
        value: /etc/network-enforcer/certs/ca.crt

sharedExternalAsserts: &sharedExternalAsserts
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://otel-endpoint:12345
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CERTIFICATE
        value: /tmp/otel-collector-certs/ca.crt
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
        value: /tmp/otel-collector-client-certs/tls.crt
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CLIENT_KEY
        value: /tmp/otel-collector-client-certs/tls.key

sharedInsecureExternalAsserts: &sharedInsecureExternalAsserts
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://otel-endpoint:12345
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_INSECURE
        value: "true"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
        value: /tmp/otel-collector-client-certs/tls.crt
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_CLIENT_KEY
        value: /tmp/otel-collector-client-certs/tls.key

tests:
  - it: "should render none configuration"
    set:
      telemetry:
        collectorStrategy: none
    asserts: *sharedNoneAsserts
  - it: "should render default configuration"
    set:
      telemetry:
        collectorStrategy: default
    asserts: *sharedDefaultAsserts
  - it: "should render external configuration"
    set:
      telemetry:
        collectorStrategy: external
    asserts: *sharedExternalAsserts
  - it: "should render insecure external configuration"
    set:
      telemetry:
        collectorStrategy: external
        externalCollector:
          otelCollectorCertificateSecret: ""
    asserts: *sharedInsecureExternalAsserts

# ---------------------------------------------------------------------------
# Shipped default collector resources (only present when strategy == default)
# ---------------------------------------------------------------------------
---
suite: "Verify shipped default OTel collector resources"
templates:
  - templates/otel-collector/configmap.yaml
  - templates/otel-collector/service.yaml
  - templates/otel-collector/deployment.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "renders the collector ConfigMap, Service and Deployment under default"
    set:
      telemetry:
        collectorStrategy: default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: my-release-network-enforcer-otel-collector
  - it: "configures count connector for cniwatcher policy deny logs"
    template: templates/otel-collector/configmap.yaml
    set:
      telemetry:
        collectorStrategy: default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: network_enforcer_policy_denies
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'attributes\["cni\.type"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: cni\.type'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: network\.protocol'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: node\.name'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: source\.namespace'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: source\.name'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: destination\.namespace'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: destination\.name'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: destination\.port'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: source\.labels'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: destination\.labels'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: source\.workloads'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: destination\.workloads'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: egress\.enforced_by'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'key: ingress\.enforced_by'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'exporters: \[count, debug\]'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'receivers: \[count, otlp\]'
  - it: "renders no collector resources under none"
    set:
      telemetry:
        collectorStrategy: none
    asserts:
      - hasDocuments:
          count: 0
  - it: "renders no collector resources under external"
    set:
      telemetry:
        collectorStrategy: external
        externalCollector:
          endpoint: https://otel-endpoint:12345
    asserts:
      - hasDocuments:
          count: 0