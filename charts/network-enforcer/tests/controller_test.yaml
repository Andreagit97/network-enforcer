suite: "Controller general configs"
templates:
  - templates/controller/deployment.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "uses default log level"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=info

  - it: "uses custom log level"
    set:
      controller:
        logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug
