apiVersion: v1
kind: ServiceAccount
metadata:
  name: http-client-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: http-server-sa
---
apiVersion: v1
kind: Service
metadata:
  name: http-service
spec:
  selector:
    app: http-server
  ports:
    - name: tcp-echo
      protocol: TCP
      port: 18080
      targetPort: 18080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      serviceAccountName: http-server-sa
      containers:
      - name: http-server
        image: nicolaka/netshoot:v0.16
        command:
          - sh
          - -c
          - |
            set -eu
            # start TCP listener
            socat -d -d TCP-LISTEN:18080,reuseaddr,fork EXEC:/bin/cat >/tmp/tcp-listener.log 2>&1 &
            wait
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-client
  template:
    metadata:
      labels:
        app: http-client
    spec:
      serviceAccountName: http-client-sa
      containers:
        - image: nicolaka/netshoot:v0.16
          name: http-client
          command: ["sleep", "10d"]
